<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A modern calculator with dark and light themes"
    >

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <title>Modern Calculator</title>
</head>

<body>
    <main class="app-wrapper">
        <section class="calculator" aria-label="Calculator">
            <header class="calculator-header">
                <div>
                    <p class="eyebrow">Calculator</p>
                    <h1>Simple &amp; Modern</h1>
                </div>

                <button
                    type="button"
                    id="themeToggle"
                    class="theme-toggle"
                    aria-label="Switch theme"
                    title="Switch theme"
                >
                    <span id="themeIcon" aria-hidden="true">☾</span>
                </button>
            </header>

            <div class="display" aria-live="polite">
                <div class="history">
                    <p id="history-value"></p>
                </div>

                <div class="output">
                    <p id="output-value">0</p>
                </div>
            </div>

            <div id="keyboard" class="keyboard">
                <button
                    type="button"
                    class="key key-function operator"
                    data-action="clear"
                >
                    AC
                </button>

                <button
                    type="button"
                    class="key key-function operator"
                    data-action="backspace"
                    aria-label="Backspace"
                >
                    ⌫
                </button>

                <button
                    type="button"
                    class="key key-function operator"
                    data-action="percentage"
                >
                    %
                </button>

                <button
                    type="button"
                    class="key key-operator operator"
                    data-operator="/"
                    aria-label="Divide"
                >
                    ÷
                </button>

                <button type="button" class="key number" data-number="7">7</button>
                <button type="button" class="key number" data-number="8">8</button>
                <button type="button" class="key number" data-number="9">9</button>

                <button
                    type="button"
                    class="key key-operator operator"
                    data-operator="*"
                    aria-label="Multiply"
                >
                    ×
                </button>

                <button type="button" class="key number" data-number="4">4</button>
                <button type="button" class="key number" data-number="5">5</button>
                <button type="button" class="key number" data-number="6">6</button>

                <button
                    type="button"
                    class="key key-operator operator"
                    data-operator="-"
                    aria-label="Subtract"
                >
                    −
                </button>

                <button type="button" class="key number" data-number="1">1</button>
                <button type="button" class="key number" data-number="2">2</button>
                <button type="button" class="key number" data-number="3">3</button>

                <button
                    type="button"
                    class="key key-operator operator"
                    data-operator="+"
                    aria-label="Add"
                >
                    +
                </button>

                <button
                    type="button"
                    class="key number key-zero"
                    data-number="0"
                >
                    0
                </button>

                <button
                    type="button"
                    class="key number"
                    data-number="."
                    aria-label="Decimal point"
                >
                    .
                </button>

                <button
                    type="button"
                    class="key key-equals operator"
                    data-action="equals"
                    aria-label="Calculate result"
                >
                    =
                </button>
            </div>

            <p class="keyboard-hint">
                Keyboard supported: numbers, operators, Enter and Backspace
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
